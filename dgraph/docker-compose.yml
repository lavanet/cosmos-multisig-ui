services:
  dgraph:
    image: dgraph/standalone:latest
    container_name: dgraph
    ports:
      - "9080:9080"
      - "8080:8080"
    volumes:
      - ./dgraph-data:/dgraph

  nginx:
    image: nginx:alpine
    container_name: dgraph-nginx
    depends_on: [dgraph]
    environment:
      DGRAPH_HOST: dgraph
      DGRAPH_HTTP_PORT: "8080"
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./secrets/auth_token:/run/secrets/auth_token:ro
    entrypoint: ["/bin/sh","-c",
      # read token from file, export for template rendering, then start
      "export AUTH_TOKEN=$(cat /run/secrets/auth_token) && exec /docker-entrypoint.sh nginx -g 'daemon off;'"
      ]